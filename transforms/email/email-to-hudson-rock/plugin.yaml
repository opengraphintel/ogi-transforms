name: email-to-hudson-rock
version: "1.0.0"
display_name: "Email to Hudson Rock"
description: "Checks an email address against Hudson Rock's free infostealer intelligence and maps any compromise to graph entities"
author: "OGI Team"
license: "AGPL-3.0"
category: "email"
input_types: ["EmailAddress"]
output_types: ["EmailAddress", "Username", "IPAddress", "Document"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["email", "hudson-rock", "infostealer", "stealer", "breach", "osint", "credentials"]
author_github: "opengraphintel"
homepage: "https://www.hudsonrock.com/threat-intelligence-cybercrime-tools"
icon: "shield-alert"
color: "#dc2626"

python_dependencies:
  - "httpx>=0.28.1"

transform_settings:
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "HTTP timeout for the Hudson Rock request"
    default: "15"
    field_type: "integer"
    min_value: 5
    max_value: 30
  - name: "max_results"
    display_name: "Max Results"
    description: "Maximum infected-host IPs and leaked-login entities to emit"
    default: "50"
    field_type: "integer"
    min_value: 1
    max_value: 200
  - name: "include_logins"
    display_name: "Include Leaked Logins"
    description: "Emit leaked logins found on infected machines as Username/EmailAddress entities"
    default: "true"
    field_type: "boolean"
  - name: "mask_passwords"
    display_name: "Mask Passwords"
    description: "Mask leaked passwords in the evidence document instead of storing them verbatim"
    default: "true"
    field_type: "boolean"

permissions:
  network: true
  filesystem: false
  subprocess: false
