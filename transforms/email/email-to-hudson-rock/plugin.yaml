name: email-to-hudson-rock
version: "1.0.1"
display_name: "Email to Hudson Rock"
description: "Checks an email address against Hudson Rock's free infostealer intelligence and maps any compromise to graph entities"
long_description: >
  Queries Hudson Rock's free Cavalier OSINT endpoint (search-by-email, no API key needed)
  for infostealer malware logs mentioning the address. When infections are found it
  re-emits the input EmailAddress enriched with a compromise flag, infection count, first
  and last compromise dates, stealer families, operating systems and corporate and user
  service counts. It adds a Document (has evidence) summarising each infection with date,
  stealer family, operating system, computer name, infected IP, malware path, antiviruses,
  top logins and top passwords; emits each infected machine's IP as an IPAddress
  (compromised on host); and emits the leaked logins as EmailAddress or Username entities
  (leaked credential) depending on their shape. Passwords in the document are masked to
  their first character by default, and the IP and login lists are each capped by Max
  Results, default 50.
when_to_use: >
  Use it when you suspect credential theft through infostealer malware rather than a site
  breach, or when you need machine-level context around a compromised account. Run Email
  to HIBP Breaches alongside it for site-breach history. The Username entities it produces
  feed Username & Phone to Hudson Rock and Username Search, and the infected-host IPs feed
  IP to Shodan Host or IP to GreyNoise Quick Context.
limitations: >
  This is real victim data harvested from malware logs, including other people's
  credentials, so only run it on accounts you are authorized to investigate and be careful
  where the resulting graph or export is stored. The free tier returns partially redacted
  data and is rate limited; a 429 ends the run with a message. No records means only that
  Hudson Rock holds no log for the address, not that the account is uncompromised. The
  infected IPs belong to the victim's machine at infection time, not to attacker
  infrastructure, and may be dynamic or shared.
example_use_cases:
  - "Determine whether an account was exposed by infostealer malware"
  - "Pull the other credentials found on the same infected machine"
  - "Collect infected-host IPs to check against infrastructure intelligence"
author: "OGI Team"
license: "AGPL-3.0"
category: "email"
input_types: ["EmailAddress"]
output_types: ["EmailAddress", "Username", "IPAddress", "Document"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["email", "hudson-rock", "infostealer", "stealer", "breach", "osint", "credentials"]
author_github: "opengraphintel"
homepage: "https://www.hudsonrock.com/threat-intelligence-cybercrime-tools"
icon: "shield-alert"
color: "#dc2626"

python_dependencies:
  - "httpx>=0.28.1"

transform_settings:
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "HTTP timeout for the Hudson Rock request"
    default: "15"
    field_type: "integer"
    min_value: 5
    max_value: 30
  - name: "max_results"
    display_name: "Max Results"
    description: "Maximum infected-host IPs and leaked-login entities to emit"
    default: "50"
    field_type: "integer"
    min_value: 1
    max_value: 200
  - name: "include_logins"
    display_name: "Include Leaked Logins"
    description: "Emit leaked logins found on infected machines as Username/EmailAddress entities"
    default: "true"
    field_type: "boolean"
  - name: "mask_passwords"
    display_name: "Mask Passwords"
    description: "Mask leaked passwords in the evidence document instead of storing them verbatim"
    default: "true"
    field_type: "boolean"

permissions:
  network: true
  filesystem: false
  subprocess: false
