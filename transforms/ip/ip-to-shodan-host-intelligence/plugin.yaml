name: ip-to-shodan-host-intelligence
version: "1.1.0"
display_name: "IP to Shodan Host Intelligence"
description: "Builds a deep Shodan host profile with service, HTTP, SSL, and evidence context"
long_description: >
  Queries Shodan's host endpoint and expands the full response into an investigation
  subgraph. The input IPAddress is enriched with ASN, ISP, organization, OS, hostnames,
  domains, ports, tags, location fields, service count, vulnerability identifiers, and a
  link back to the Shodan host page. It then emits an ASNumber and an Organization for the
  owning network, a Location entity, a Document holding the full evidence summary, and
  Domain or Subdomain entities for every hostname and domain Shodan reports. When
  include_services is on, each observed HTTP or TLS service becomes a URL entity, and
  selected response headers such as Server, X-Powered-By, and the common security headers
  become HTTPHeader entities hung off that URL. When include_ssl is on, certificates are
  emitted as SSLCertificate entities carrying subject, issuer, serial, both fingerprints,
  validity dates, and SANs. include_vulnerabilities controls whether CVE identifiers appear
  in the evidence document. A Shodan API key is required.
when_to_use: >
  Use this when an IP address is already a subject of the investigation and you need its
  attack surface laid out as graph nodes: open services, hostnames sharing the host,
  certificates that link it to other infrastructure, and reported vulnerabilities. IP to
  Shodan Host is the lighter baseline and the right first step when you only want to know
  who owns an address; come here once that answer justifies a deeper pass. Certificate and
  hostname entities from this transform pivot naturally into domain-side work.
limitations: >
  Every run spends Shodan API query credits, and the endpoint returns 429 when the rate
  limit is reached. Shodan reports what its scanners last observed, not the live state of
  the host, so ports and banners may be days or weeks stale and hosts that were never
  scanned return nothing. Reported vulnerabilities are inferred from version banners and are
  not confirmed exploitable. Only a fixed set of security-relevant HTTP headers is retained;
  the rest of each banner is dropped.
example_use_cases:
  - "Map the exposed services and open ports of a host under investigation"
  - "Pull certificates off an IP address to find other infrastructure sharing them"
  - "Discover hostnames and domains that resolve to the same server"
  - "Collect a dated evidence document of a host's observed configuration"
author: "OGI Team"
license: "AGPL-3.0"
category: "ip"
input_types: ["IPAddress"]
output_types: ["IPAddress", "ASNumber", "Organization", "Domain", "Subdomain", "Location", "Document", "HTTPHeader", "SSLCertificate", "URL"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["ip", "shodan", "ports", "services", "http", "ssl", "enrichment"]
author_github: "opengraphintel"
icon: "scan-search"
color: "#f97316"

python_dependencies:
  - "httpx>=0.28.1"

api_keys_required:
  - service: "shodan"
    description: "Shodan API key from https://account.shodan.io/"
    env_var: "SHODAN_API_KEY"

transform_settings:
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "HTTP timeout for the Shodan host request"
    default: "15"
    field_type: "integer"
    min_value: 5
    max_value: 30
  - name: "include_services"
    display_name: "Include Services"
    description: "Emit URL and HTTP header entities from service observations"
    default: "true"
    field_type: "boolean"
  - name: "include_vulnerabilities"
    display_name: "Include Vulnerabilities"
    description: "Include vulnerability identifiers in the evidence summary"
    default: "true"
    field_type: "boolean"
  - name: "include_ssl"
    display_name: "Include SSL"
    description: "Emit certificate entities from SSL-enabled services"
    default: "true"
    field_type: "boolean"

permissions:
  network: true
  filesystem: false
  subprocess: false
