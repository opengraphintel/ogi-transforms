name: ip-to-shodan-host
version: "1.0.0"
display_name: "IP to Shodan Host"
description: "Creates a baseline Shodan host summary for an IP address"
long_description: >
  Queries Shodan's host endpoint for the given IP address and turns the response
  into a compact profile: a summary Document with the key observations, plus
  ASNumber, Organization, Location, and Network entities whenever Shodan reports
  them. The input IPAddress entity is enriched in place with the headline host
  fields so the graph stays readable without opening the document.
when_to_use: >
  Use this as the first Shodan step on an IP address, when you want a quick
  picture of who owns the host and roughly what it is before committing to a
  deeper scan. If you already know you need service banners, HTTP details, URLs,
  or certificates, skip straight to IP to Shodan Host Intelligence instead,
  which covers the same ground in far more detail.
limitations: >
  Shodan reports what its scanners last observed, not the live state of the
  host, so results can be days or weeks stale. Hosts that have never been
  scanned return nothing at all. Every run consumes Shodan API query credits,
  and free API tiers are limited to roughly one request per second.
example_use_cases:
  - "Triage an unfamiliar IP before deciding whether to investigate further"
  - "Attribute an IP address to an organization and hosting network"
  - "Add geolocation and ASN context to infrastructure discovered via DNS"
author: "OGI Team"
license: "AGPL-3.0"
category: "ip"
input_types: ["IPAddress"]
output_types: ["IPAddress", "Document", "Organization", "ASNumber", "Location", "Network"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["ip", "shodan", "host", "summary", "enrichment"]
author_github: "opengraphintel"
icon: "server"
color: "#f97316"

python_dependencies:
  - "httpx>=0.28.1"

api_keys_required:
  - service: "shodan"
    description: "Shodan API key from https://account.shodan.io/"
    env_var: "SHODAN_API_KEY"

transform_settings:
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "HTTP timeout for the Shodan host request"
    default: "15"
    field_type: "integer"
    min_value: 5
    max_value: 30

permissions:
  network: true
  filesystem: false
  subprocess: false
