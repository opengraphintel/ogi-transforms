name: username-maigret
version: "1.2.1"
display_name: "Username OSINT (Maigret Adoption)"
description: "Finds claimed usernames using an OGI-native checker with a vendored Maigret site database"
long_description: >
  Normalizes the input into a username candidate, accepting a Username directly, the handle
  part of a SocialMedia value, or a Person name collapsed to lowercase without spaces. It
  then loads a vendored copy of Maigret's site database, keeps username-type sites, drops
  disabled ones unless include_disabled_sites is set, sorts them by rank, and probes the top
  top_sites entries concurrently over HTTP. Each site is judged by the check style its
  definition declares: presence and absence strings in the response body, the HTTP status
  code, or the redirect target. Sites judged Claimed produce a SocialMedia entity valued
  handle@platform, linked by a "has account" edge and carrying platform, username, profile
  URL, status, check type, HTTP status, and site tags, plus a child URL entity for the
  profile linked by a "profile URL" edge. Available and errored sites are dropped and only
  counted in the summary message. Output stops at max_results, default 100. No API key and
  no external process are involved; the checker runs in-process using httpx.
when_to_use: >
  Use this for the broadest username sweep available here, when you want to know where a
  handle is taken across hundreds of sites. Username Search is the quick alternative when
  three well-known platforms are enough and you want no extra setup. Username OSINT
  (user-scanner) is the choice when you want category-scoped scanning or an email
  registration check rather than a ranked sweep. Feed the SocialMedia entities this produces
  into Social Profile to Entities, or its URL entities into Profile URL to Identifiers, to
  see what is actually on each page.
limitations: >
  Username enumeration produces false positives. A site that answers a missing profile with a
  soft-404, an HTTP 200 carrying a "not found" page, is scored as Claimed under status-code
  checks. More importantly, a matched profile URL only shows the handle is taken on that
  site; it is not evidence that the same person owns accounts across sites, and common
  handles are held by many unrelated people. The vendored site database drifts as sites
  change their markup and defences. Probing hundreds of sites concurrently draws rate
  limiting, CAPTCHAs, and blocks; those sites are recorded as errors and silently omitted.
example_use_cases:
  - "Sweep a handle across hundreds of platforms to find candidate accounts to verify"
  - "Build a starting map of a subject's possible online presence from one username"
  - "Identify niche platforms where a handle is claimed but mainstream tools miss it"
author: "OGI Team"
license: "AGPL-3.0"
category: "social"
input_types: ["SocialMedia", "Person", "Username"]
output_types: ["SocialMedia", "URL"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["social", "username", "osint", "enumeration", "maigret", "adoption"]
author_github: "opengraphintel"
icon: "users"
color: "#0f766e"

python_dependencies:
  - "httpx>=0.28.1"

transform_settings:
  - name: "top_sites"
    display_name: "Top Sites"
    description: "Maximum number of ranked sites from the vendored Maigret database to query"
    default: "200"
    field_type: "integer"
    min_value: 10
    max_value: 1000
  - name: "include_disabled_sites"
    display_name: "Include Disabled Sites"
    description: "Include sites that the vendored Maigret database marks as disabled"
    default: "false"
    field_type: "boolean"
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "Per-request timeout used by the adoption checker"
    default: "15"
    field_type: "integer"
    min_value: 3
    max_value: 60
  - name: "max_results"
    display_name: "Max Results"
    description: "Maximum number of claimed accounts to return"
    default: "100"
    field_type: "integer"
    min_value: 1
    max_value: 500
  - name: "concurrency"
    display_name: "Concurrency"
    description: "Maximum concurrent site checks"
    default: "20"
    field_type: "integer"
    min_value: 1
    max_value: 50

permissions:
  network: true
  filesystem: false
  subprocess: false
