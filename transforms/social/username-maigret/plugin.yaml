name: username-maigret
version: "1.3.0"
display_name: "Username OSINT (Maigret Adoption)"
description: "Finds claimed usernames using an OGI-native checker with a vendored Maigret site database"
long_description: >
  Normalizes the input into a username candidate, accepting a Username directly, the handle
  part of a SocialMedia value, or a Person name collapsed to lowercase without spaces. It
  then loads a vendored copy of the Maigret 0.6.6 site database (about 5,900 sites, most of
  them forums, discussion boards and wikis), applies each site's engine template (XenForo,
  Discourse, MediaWiki, Lemmy, Mastodon and others), and keeps username-type sites it can
  check over plain HTTP. Disabled sites are dropped unless include_disabled_sites is set, and
  sites Maigret marks as bot-protected are dropped unless include_protected_sites is set.
  With site_tags empty it probes the top_sites most popular sites; with tags such as forum,
  wiki, a country code or an engine name it probes the matching sites instead. Each site is
  judged the way Maigret judges it: presence and absence strings in the response body, the
  HTTP status code, or the redirect target, after the site's own regex, POST body and error
  markers are applied. Block pages, CAPTCHAs, 403, 429 and 5xx answers count as unknown,
  never as found or not found. Sites judged Claimed produce a SocialMedia entity valued
  handle@platform, linked by a "has account" edge and carrying platform, username, profile
  URL, check type, HTTP status, engine and site tags, plus a child URL entity linked by a
  "profile URL" edge. Output stops at max_results, default 100. No API key and no external
  process are involved; the checker runs in-process using httpx.
when_to_use: >
  Use this for the broadest username sweep available here, when you want to know where a
  handle is taken across hundreds of sites. Set site_tags to forum, wiki or a country code to
  reach small forums and wikis that search engines rarely surface. Username Search is the
  quick alternative when three well-known platforms are enough. Username OSINT
  (user-scanner) is the choice when you want category-scoped scanning or an email
  registration check rather than a ranked sweep. Feed the SocialMedia entities this produces
  into Social Profile to Entities, or its URL entities into Profile URL to Identifiers, to
  see what is actually on each page.
limitations: >
  Username enumeration produces false positives. A site that answers a missing profile with a
  soft-404, an HTTP 200 carrying a "not found" page, is scored as Claimed under status-code
  checks. A matched profile URL only shows the handle is taken on that site; it is not
  evidence that the same person owns accounts across sites, and common handles are held by
  many unrelated people. Sites that need browser TLS fingerprints, Cloudflare challenge
  solving, cookies, or DNS, Tor or I2P gateways are skipped, so coverage of large platforms
  is lower than upstream Maigret's. Only the first 1,000 matching sites are probed per run.
  The vendored database drifts as sites change their markup and defences.
example_use_cases:
  - "Sweep a handle across hundreds of platforms to find candidate accounts to verify"
  - "Build a starting map of a subject's possible online presence from one username"
  - "Search small forums, discussion boards and wikis for a handle with site_tags"
  - "Check one forum engine at a time, such as Discourse or XenForo communities"
author: "OGI Team"
license: "AGPL-3.0"
category: "social"
input_types: ["SocialMedia", "Person", "Username"]
output_types: ["SocialMedia", "URL"]
min_ogi_version: "0.3.0"
verification_tier: "community"

tags: ["social", "username", "osint", "enumeration", "maigret", "adoption", "forum", "wiki"]
author_github: "opengraphintel"
icon: "users"
color: "#0f766e"

python_dependencies:
  - "httpx>=0.28.1"

transform_settings:
  - name: "top_sites"
    display_name: "Top Sites"
    description: "Maximum number of ranked sites from the vendored Maigret database to query"
    default: "200"
    field_type: "integer"
    min_value: 10
    max_value: 1000
  - name: "site_tags"
    display_name: "Site Tags"
    description: "Comma-separated Maigret tags or engine names to scan instead of the most popular sites, e.g. forum, wiki, de, Discourse. A site matches if it has any of them."
    default: ""
    field_type: "string"
    pattern: "^[A-Za-z0-9_ ,./-]*$"
  - name: "include_disabled_sites"
    display_name: "Include Disabled Sites"
    description: "Include sites that the vendored Maigret database marks as disabled"
    default: "false"
    field_type: "boolean"
  - name: "include_protected_sites"
    display_name: "Include Protected Sites"
    description: "Also probe sites Maigret marks as behind bot protection (TLS fingerprinting, Cloudflare challenges, IP reputation). A plain HTTP client is usually refused there, and refusals are reported as unknown"
    default: "false"
    field_type: "boolean"
  - name: "timeout_seconds"
    display_name: "Timeout Seconds"
    description: "Per-request timeout used by the adoption checker"
    default: "15"
    field_type: "integer"
    min_value: 3
    max_value: 60
  - name: "max_results"
    display_name: "Max Results"
    description: "Maximum number of claimed accounts to return"
    default: "100"
    field_type: "integer"
    min_value: 1
    max_value: 500
  - name: "concurrency"
    display_name: "Concurrency"
    description: "Maximum concurrent site checks"
    default: "20"
    field_type: "integer"
    min_value: 1
    max_value: 50

permissions:
  network: true
  filesystem: false
  subprocess: false
